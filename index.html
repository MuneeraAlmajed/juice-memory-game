<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Memory Game</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Juice Memory Game</h1>
        <p id="instructions"><b>How to play?</b></p>
        <p>- memorize the ingredients, you have only 5s!</p>
        <p>- select the correct and in order ingredients before the time runs out!</p>
        <p id="memory">Memorize the ingredients!</p>
    </header>

    <main>
        <p id="instructions"></p>
        <button id="start-btn">Start the Game</button>
        <p id="timer"></p>
        <p id= "ingredients"></p>
        <p id="message"></p>
        <button id="play-again-btn">Clear</button>
        <button id="submit-btn">Make Juice</button>
        <p id= "player-answer"></p>
        <p id="correct-answer"></p>
    </main>
    
</body>
</html>
