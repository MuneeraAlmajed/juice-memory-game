<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Memory Game 🍹</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <!--background-->
    <div class="background-fruits">
        <span class="fruit fruit-1">🍓</span>
        <span class="fruit fruit-2">🍊</span>
        <span class="fruit fruit-3">🥝</span>
        <span class="fruit fruit-4">🍋</span>
        <span class="fruit fruit-5">🫐</span>
        <span class="fruit fruit-6">🍉</span>
    </div>

    <main class="game">
        <header class="game-header">
            <div class="logo">
                <span class="logo-icon">🍹</span>
                <span>Juice Memory Game</span>
            </div>
            <h1>
                Create Your Perfect Blend
            </h1>
            <p id="instructions">
                Memorize the secret recipe for 5 seconds,
                then recreate it!
            </p>
            <div id="timer">Ready?</div>
        </header>

        <!-- Start Game -->
        <button id="start-btn" class="start-button">
            <span>🍓</span>Start Game<span>🍊</span>
        </button>

        <!-- Ingredients -->
        <section class="ingredients-area">
            <div class="section-header">
                <div class="decorative-line"></div>
                <h2>
                    Pick Your Ingredients
                </h2>
                <div class="decorative-line"></div>
            </div>

            <p class="section-description">Choose the ingredients you remember</p>
            <div id="ingredients" class="ingredients-grid"></div>
        </section>

        <!-- Juice Area -->
        <section class="juice-area">
            <div class="section-header">
                <div class="decorative-line"></div>
                <h2>
                    Your Juice
                </h2>
                <div class="decorative-line"></div>
            </div>

            <!-- Glass -->
            <div class="glass-container">
                <div class="straw"></div>
                <div class="glass">
                    <!-- Juice -->
                    <div id="juice" class="juice">
                        <!-- Ingredients -->
                        <div
                            id="ingredients-in-cup"
                        ></div>
                        <!-- Bubbles -->
                        <div class="bubble bubble-1"></div>
                        <div class="bubble bubble-2"></div>
                        <div class="bubble bubble-3"></div>
                    </div>

                    <!-- Glass Shine -->
                    <div class="glass-highlight"></div>
                </div>

                <!-- Glass Shadow -->
                <div class="glass-shadow"></div>
            </div>
        </section>

        <!-- Make Juice -->
        <button id="submit-btn" class="make-button">
            <span class="button-icon"></span>
            Make My Juice
            <span class="sparkle"></span>
        </button>
        <!-- Game Message -->
        <div id="message" class="message"></div>

        <!-- Play Again -->
        <button id="play-again-btn" class="play-again">
            Play Again
        </button>
    </main>
</body>
</html>
